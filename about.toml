# The third-party notices (THIRD-PARTY-NOTICES.html), generated with
# cargo-about by `just notices` for ren's and the Servo helper's
# workspaces (crates/ren-servo uses this file too). The licences are
# deny.toml's, the policy of "Licensing" in docs/PLAN.md.

accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# What is in the binaries: not the tests' crates, nor those only build
# scripts use.
ignore-dev-dependencies = true
ignore-build-dependencies = true
# Crates whose licence files cargo-about knows to need help with.
workarounds = ["ring", "rustls"]

# The exceptions of deny.toml.
[webpki-roots]
accepted = ["CDLA-Permissive-2.0"]

[ksni]
accepted = ["Unlicense"]
