[files]
extend-exclude = [
    # Generated (`just notices`), from the crates' licences.
    "THIRD-PARTY-NOTICES.html",
    # Feed data, the articles' own words.
    "crates/nextcloud-news/tests/fixtures/",
]

[default]
# Misspelt on purpose, in the settings' tests (ren-settings'
# settings.rs): only with the words around them, so the same typo
# anywhere else is still found.
extend-ignore-re = [
    '\\nswitch = true\\nswtich = false\\n',
    'warning: unknown setting a\.swtich"',
    '"\[a\]\\nswitch = tru\\n"',
]

[default.extend-identifiers]
PNGs = "PNGs"
