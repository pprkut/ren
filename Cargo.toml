[workspace]
resolver = "3"
members = ["crates/*"]
# Servo's helper, a workspace of its own (see its Cargo.toml).
exclude = ["crates/ren-servo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Slint 1.18's.
rust-version = "1.92"
license = "GPL-3.0-or-later"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
