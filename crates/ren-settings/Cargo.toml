[package]
name = "ren-settings"
description = "Settings, UI state and the app password of ren"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Reads and changes single values of the settings file, keeping the user's
# comments and formatting. Already built for Slint and zbus (proc-macro-crate).
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# The state file, which only ren writes: read and written whole.
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde"] }
# The app password in the Secret Service (GNOME Keyring, KWallet). The
# zbus store talks D-Bus through the zbus that Slint's winit backend
# already brings, on its async-io runtime; the alternative store uses
# libdbus. crypto-rust: the secret is encrypted on the bus (the session
# libsecret uses too), with RustCrypto instead of OpenSSL.
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
# To tell which program answers the Secret Service (ren --check-secret-service).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
