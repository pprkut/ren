[package]
name = "ren-settings"
description = "Settings, UI state and the app password of ren"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Reads and changes single values of the settings file, keeping the user's
# comments and formatting. Already built for Slint and zbus (proc-macro-crate).
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# The state file, which only ren writes: read and written whole.
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde"] }
