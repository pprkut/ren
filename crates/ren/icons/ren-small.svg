<!-- Ren's logo for 16 to 32 pixels, the window's icon and the tray: the lotus of ren.svg without its wires, the petals behind others cut off where they disappear, drawn on Breeze's 22-pixel grid (one-pixel lines). -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <defs>
    <linearGradient id="petal" x1="0" y1="2.5" x2="0" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0609e"/>
      <stop offset="1" stop-color="#8e4fd0"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#petal)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <!-- The middle petal, then the visible edges of the inner and outer ones. -->
    <path d="M11 19C7.6 15.8 7.6 8.2 11 2.5C14.4 8.2 14.4 15.8 11 19Z"/>
    <path d="M9.6 17.4C6 15.6 4 11.5 4.5 6.5C6.4 7.3 7.8 8.6 8.6 10.4"/>
    <path d="M12.4 17.4C16 15.6 18 11.5 17.5 6.5C15.6 7.3 14.2 8.6 13.4 10.4"/>
    <path d="M11 19C6.5 19.3 2.5 16.8 1 12.5C2.8 12.1 4.5 12.4 6 13.3"/>
    <path d="M11 19C15.5 19.3 19.5 16.8 21 12.5C19.2 12.1 17.5 12.4 16 13.3"/>
  </g>
</svg>
