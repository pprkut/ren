<!-- Ren's logo: a wire-frame lotus (蓮, ren), for 48 pixels and up. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="petal" x1="0" y1="8" x2="0" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0609e"/>
