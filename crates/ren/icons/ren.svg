    <path d="M32 50C44 51 56 45 60.5 33C50 31.5 38 37 32 50Z"/>
    <path d="M32 50C21 46 12.5 34 14.5 18.5C24 22.5 31 33 32 50Z"/>
    <path d="M32 50C43 46 51.5 34 49.5 18.5C40 22.5 33 33 32 50Z"/>
    <path d="M32 50C22.5 41 22.5 22 32 8C41.5 22 41.5 41 32 50Z"/>
  </g>
  <g fill="none" stroke="url(#petal)" stroke-width="1.3" stroke-linecap="round" opacity="0.8">
    <!-- The wires: each petal's midrib and two cross lines. -->
    <path d="M32 50L3.5 33M32 50L60.5 33M32 50L14.5 18.5M32 50L49.5 18.5M32 50V8"/>
    <path d="M16.5 47.2Q19.6 42.6 20.9 37M8.9 41.6Q12.3 38 12.5 33.4M47.5 47.2Q44.4 42.6 43.1 37M55.1 41.6Q51.7 38 51.5 33.4"/>
