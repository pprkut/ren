    <path d="M24.9 33.1Q32 29.1 39.1 33.1M26.3 20.6Q32 18.9 37.7 20.6"/>
  </g>
  <path d="M14 56.5Q32 60 50 56.5" fill="none" stroke="#3aa6b9" stroke-width="2.2" stroke-linecap="round"/>
</svg>
