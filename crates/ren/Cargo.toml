[package]
name = "ren"
description = "A native Nextcloud News reader"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["renderer-software"]
renderer-femtovg = ["slint/renderer-femtovg"]
renderer-skia = ["slint/renderer-skia"]
renderer-software = ["slint/renderer-software"]
# Slint's native Qt style and the Qt backend it draws with; needs the Qt 6
# development files at build time.
style-qt = ["slint/backend-qt"]

[dependencies]
freedesktop-icons = "0.4"
nextcloud-news = { path = "../nextcloud-news" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-18", "backend-winit"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[build-dependencies]
slint-build = "1.18"
