[package]
name = "ren"
description = "A native Nextcloud News reader"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["renderer-software", "html-view", "servo"]
# The article pane renders HTML with Blitz; without it, a plain-text
# rendering of the body is shown.
html-view = [
    "dep:anyrender",
    "dep:anyrender_vello_cpu",
    "dep:arboard",
    "dep:atomic_refcell",
    "dep:base64",
    "dep:blitz-dom",
    "dep:blitz-html",
    "dep:blitz-paint",
    "dep:blitz-traits",
    "dep:cursor-icon",
    "dep:image",
    "dep:jpeg-decoder",
    "dep:keyboard-types",
    "dep:kurbo",
    "dep:parley",
    "dep:peniko",
    "dep:percent-encoding",
    "dep:rustls",
    "dep:ureq",
    "dep:url",
]
# Full web pages in tabs, rendered by Servo in a helper process
# (crates/ren-servo, built on its own), which is only started when the
# first tab opens. Without it, pages open in the system browser.
servo = ["dep:ren-tabs"]
renderer-femtovg = ["slint/renderer-femtovg"]
renderer-skia = ["slint/renderer-skia"]
renderer-software = ["slint/renderer-software"]
# Slint's native Qt style and the Qt backend it draws with; needs the Qt 6
# development files at build time.
style-qt = ["slint/backend-qt"]

[dependencies]
anyrender_vello_cpu = { version = "0.17", optional = true }
arboard = { version = "3.6", optional = true, default-features = false, features = ["wayland-data-control"] }
# Pre-release: document text selection is only in 0.3 (see
# docs/decisions/0004-article-view.md).
blitz-dom = { version = "=0.3.0-beta.2", optional = true, default-features = false, features = ["floats", "svg", "system-fonts", "complex-scripts"] }
blitz-html = { version = "=0.3.0-beta.2", optional = true }
blitz-paint = { version = "=0.3.0-beta.2", optional = true, default-features = false, features = ["svg"] }
blitz-traits = { version = "=0.3.0-beta.2", optional = true }
# Types in Blitz's API, at the versions it uses.
anyrender = { version = "0.13", optional = true }
atomic_refcell = { version = "0.1", optional = true }
base64 = { version = "0.23", optional = true }
cursor-icon = { version = "1", optional = true }
keyboard-types = { version = "0.7", optional = true }
kurbo = { version = "0.13", optional = true }
parley = { version = "0.11", optional = true, default-features = false, features = ["std"] }
peniko = { version = "0.6", optional = true }
percent-encoding = { version = "2", optional = true }
url = { version = "2.5", optional = true }
freedesktop-icons = "0.4"
# Images scaled down before Blitz decodes them, with the formats Blitz
# already brings (through anyrender_svg).
image = { version = "0.25", optional = true, default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# Decodes large JPEGs at 1/2, 1/4 or 1/8 of their size, which the image
# crate's decoder can't.
jpeg-decoder = { version = "0.3", optional = true, default-features = false }
nextcloud-news = { path = "../nextcloud-news" }
ren-settings = { path = "../ren-settings" }
ren-store = { path = "../ren-store" }
ren-sync = { path = "../ren-sync" }
ren-tabs = { path = "../ren-tabs", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-18", "backend-winit"] }
# For images in articles; the same TLS setup as nextcloud-news.
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
ureq = { version = "3.4", optional = true, default-features = false, features = ["rustls-no-provider", "platform-verifier", "gzip"] }

[build-dependencies]
slint-build = "1.18"
