name: Full Tests

# The builds with the rendering engines and the end-to-end test, which
# downloads Nextcloud and News: for pull requests, master, weekly and on
# demand. A branch without a pull request is only checked by
# code-tests.yml.
on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

# A new push to a branch cancels the run for the one before; on master
# every commit is checked to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything with the default features, including the article view. The
  # tests run with coverage (cargo-llvm-cov), which the job's summary
  # shows and the codecov job uploads.
  full:
    name: Lint and test with all default features
    # Not on a fork's schedule.
    if: github.event_name != 'schedule' || !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          components: clippy, llvm-tools-preview
          tools: just,cargo-llvm-cov
      - run: just clippy
      # The tests, with their coverage in the job's summary.
      - run: cargo llvm-cov --no-report --locked --workspace
      - name: Coverage
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage report for Codecov
        run: cargo llvm-cov report --lcov --output-path target/lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: target/lcov.info
          if-no-files-found: error
          retention-days: 7

  # The full job's coverage to Codecov, by OIDC, in a job of its own: the
  # right to an OIDC token (id-token: write) never meets the job that
  # builds and runs the crates' code. A failed upload shows, but doesn't
  # fail the run.
  codecov:
    name: Upload to Codecov
    needs: full
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Codecov's upload by OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: target
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/lcov.info
          disable_search: true
          # Pull requests from forks can't get an OIDC token and fall
          # back to tokenless uploads, which Codecov allows for public
          # repositories.
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          fail_ci_if_error: true

  # ren and its helper with the oldest Rust they support: their
  # rust-version, read from Cargo.toml.
  msrv:
    name: Build with the oldest supported Rust
    if: github.event_name != 'schedule' || !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: $/.github/actions/setup-rust
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          cache-workspaces: |
            . -> target
            crates/ren-servo -> ../../target
      - run: just msrv

  # Login, syncs and log out against Nextcloud with the News app in a
  # container (scripts/test-nextcloud.sh): the release on the desktop's
  # server and the newest.
  nextcloud:
    name: End to end with Nextcloud ${{ matrix.nextcloud }} and News ${{ matrix.news }}
    if: github.event_name != 'schedule' || !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - nextcloud: "32"
            news: 28.7.0
          - nextcloud: "33"
            news: 29.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          system-libraries: false
      - run: just test-nextcloud
        env:
          NEXTCLOUD_IMAGE: docker.io/library/nextcloud:${{ matrix.nextcloud }}-apache
          NEWS_VERSION: ${{ matrix.news }}

  # Servo's helper for web page tabs (crates/ren-servo, a workspace of its
  # own): Servo is big (SpiderMonkey, WebRender, about 430 more crates).
  # Without debug info the target directory fits the runner's disk.
  servo:
    name: Lint and test Servo's helper
    if: github.event_name != 'schedule' || !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          components: clippy
          cache-workspaces: crates/ren-servo -> ../../target
      - run: just clippy-servo
      - run: just test-servo
