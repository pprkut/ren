name: Dependencies

# The dependencies' licences, security advisories and the third-party
# notices: on every push, and weekly, as RustSec's advisories come
# without a commit.
on:
  push:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

# A new push to a branch cancels the run for the one before; on master
# every commit is checked to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  licenses:
    name: Dependency licenses
    # Not on a fork's schedule.
    if: github.event_name != 'schedule' || !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          system-libraries: false
          cache: false
          tools: just,cargo-deny
      - run: just licenses
      - run: just licenses-servo

  # RustSec's advisories: vulnerabilities, unmaintained and yanked crates
  # (the policy is in deny.toml).
  advisories:
    name: Security advisories
    if: github.event_name != 'schedule' || !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          system-libraries: false
          cache: false
          tools: just,cargo-deny
      - run: just advisories
      - run: just advisories-servo

  # THIRD-PARTY-NOTICES.html must match both Cargo.lock files: `just
  # notices` regenerates it.
  notices:
    name: Third-party notices
    if: github.event_name != 'schedule' || !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The cargo-about that generated the file: another may word it
      # differently.
      - uses: $/.github/actions/setup-rust
        with:
          system-libraries: false
          cache: false
          tools: just,cargo-about@0.9.2
      - run: just notices --check
