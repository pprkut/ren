name: CI

# Every pushed branch, so work on feature branches is checked before review.
# The full build with the rendering engines runs less often, see the `full`
# job.
on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

# A new push to a branch cancels the run for the one before; on master
# every commit is checked to the end. Push and pull request runs have
# their own groups, as they run different jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          system-libraries: false
          cache: false
          tools: just,cargo-deny
      - run: just licenses
      - run: just licenses-servo

  # THIRD-PARTY-NOTICES.html must match both Cargo.lock files: `just
  # notices` regenerates it.
  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The cargo-about that generated the file: another may word it
      # differently.
      - uses: ./.github/actions/setup-rust
        with:
          system-libraries: false
          cache: false
          tools: just,cargo-about@0.9.2
      - run: just notices --check

  # Without the heavy engines (Blitz, Servo), so it stays fast. The
  # `servo` feature is only the window's side of the tabs; Servo itself is
  # in the helper, crates/ren-servo.
  rust:
    name: Format, lint, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - run: just fmt-check
      - run: just clippy-light
      - run: just test-light
      - name: Test the Secret Service store
        run: |
          sudo apt-get install -y --no-install-recommends dbus-daemon gnome-keyring
          just test-secret-service

  # Everything with the default features, including the article view: for
  # pull requests, master, weekly and on demand. The tests run with
  # coverage (cargo-llvm-cov), which the job's summary shows.
  full:
    name: Lint and test with all default features
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, llvm-tools-preview
          tools: just,cargo-llvm-cov
      - run: just clippy
      # The tests, with their coverage in the job's summary.
      - run: cargo llvm-cov --no-report --locked --workspace
      - name: Coverage
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Login, syncs and log out against Nextcloud with the News app in a
  # container (scripts/test-nextcloud.sh): the release on the desktop's
  # server and the newest. For the same events as `full`: it downloads
  # Nextcloud and News.
  nextcloud:
    name: End to end with Nextcloud ${{ matrix.nextcloud }} and News ${{ matrix.news }}
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - nextcloud: "32"
            news: 28.7.0
          - nextcloud: "33"
            news: 29.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          system-libraries: false
      - run: just test-nextcloud
        env:
          NEXTCLOUD_IMAGE: docker.io/library/nextcloud:${{ matrix.nextcloud }}-apache
          NEWS_VERSION: ${{ matrix.news }}

  # Servo's helper for web page tabs (crates/ren-servo, a workspace of its
  # own), for the same events as `full`: Servo is big (SpiderMonkey,
  # WebRender, about 430 more crates). Without debug info the target
  # directory fits the runner's disk; the cache is only saved on master, so
  # pull requests don't push out the other caches.
  servo:
    name: Lint and test Servo's helper
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache-workspaces: crates/ren-servo -> ../../target
          cache-save: ${{ github.ref == 'refs/heads/master' }}
      - run: just clippy-servo
      - run: just test-servo
