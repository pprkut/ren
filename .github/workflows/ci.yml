name: CI

# Every pushed branch, so work on feature branches is checked before review.
# The full build with the rendering engines runs less often, see the `full`
# job.
on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
      - name: Servo's helper
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: crates/ren-servo/Cargo.toml
          command: check licenses

  # Without the heavy engines (Blitz, Servo), so it stays fast.
  rust:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Slint links against fontconfig; everything else is loaded at runtime.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo fmt --check
        working-directory: crates/ren-servo
      - run: cargo clippy --all-targets --locked --no-default-features --features renderer-software -- -D warnings
      - run: cargo test --locked --no-default-features --features renderer-software
      - name: Test the Secret Service store
        run: |
          sudo apt-get install -y --no-install-recommends dbus-daemon gnome-keyring
          scripts/test-secret-service.sh

  # Everything with the default features, including the article view: for
  # pull requests, master, weekly and on demand.
  full:
    name: Lint and test with all default features
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Servo's helper for web page tabs (crates/ren-servo, a workspace of its
  # own), for the same events as `full`: Servo is big (SpiderMonkey,
  # WebRender, about 430 more crates). Without debug info the target
  # directory fits the runner's disk; the cache is only saved on master, so
  # pull requests don't push out the other caches.
  servo:
    name: Lint and test Servo's helper
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/ren-servo
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/ren-servo -> ../../target
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
