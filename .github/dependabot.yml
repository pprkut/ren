# Only the actions: Cargo's updates are done by hand, as Servo and Blitz
# pin many crates and their stylo versions have to stay apart.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # The workflows, and the composite actions they use.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
