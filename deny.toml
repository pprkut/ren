# License policy, see "Licensing" in docs/PLAN.md.
# Run with `cargo deny check licenses advisories` (`just licenses
# advisories`; the Servo helper's: `just licenses-servo advisories-servo`).

[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

# RustSec's advisories. Vulnerabilities count for every crate in the tree,
# unmaintained crates only for the workspaces' own dependencies: the others
# are for Slint, zbus and Servo to replace, there is no update to take. A
# yanked crate is usually fixed by `cargo update`.
[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.93
# The list is the policy, not an inventory of what is currently in use.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # Mozilla's CA certificates as data, pulled in by Servo's networking
    # (servo-net enables async-tungstenite's webpki-roots unconditionally).
    # CDLA-Permissive-2.0 imposes no conditions on the results; who
    # redistributes the data must include the licence text, which the
    # third-party notices do (plan, M11). Approved for this crate only,
    # see docs/decisions/0005-web-tabs.md.
    { name = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    # The StatusNotifierItem (tray icon) client behind Slint's
    # SystemTrayIcon. The Unlicense dedicates the code to the public
    # domain, with a permissive licence as fallback; the FSF lists it as
    # compatible with the GPL. Approved for this crate only in the M8
    # review, see docs/decisions/0013-polish.md.
    { name = "ksni", allow = ["Unlicense"] },
]
